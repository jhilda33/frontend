<div class="container">
  <h1>Gestión de Empleados</h1>
  
  <!-- Formulario de registro -->
  <div class="formulario-section">
    <h2>Registrar Nuevo Empleado</h2>
    <form (ngSubmit)="guardarEmpleado()" #empleadoForm="ngForm">
      <div class="form-group">
        <label>Nombre:</label>
        <input 
          type="text" 
          [(ngModel)]="nuevoEmpleado.nombre" 
          name="nombre" 
          required
          placeholder="Ingrese el nombre">
      </div>

      <div class="form-group">
        <label>Apellido:</label>
        <input 
          type="text" 
          [(ngModel)]="nuevoEmpleado.apellido" 
          name="apellido" 
          required
          placeholder="Ingrese el apellido">
      </div>

      <div class="form-group">
        <label>Correo:</label>
        <input 
          type="email" 
          [(ngModel)]="nuevoEmpleado.correo" 
          name="correo" 
          required
          placeholder="ejemplo@email.com">
      </div>

      <div class="form-group">
        <label>Salario:</label>
        <input 
          type="number" 
          [(ngModel)]="nuevoEmpleado.salario" 
          name="salario" 
          required
          placeholder="0.00"
          step="0.01">
      </div>

      <button type="submit" class="btn-submit">Guardar Empleado</button>
    </form>
  </div>

  <!-- Tabla de empleados -->
  <div class="tabla-section">
    <h2>Lista de Empleados</h2>
    
    <!-- Debug: mostrar cantidad -->
    <p>Total empleados: {{ empleados.length }}</p>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Correo</th>
          <th>Salario</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let empleado of empleados">
          <td>{{ empleado.id }}</td>
          <td>{{ empleado.nombre }}</td>
          <td>{{ empleado.apellido }}</td>
          <td>{{ empleado.correo }}</td>
          <td>{{ empleado.salario }}</td>
        </tr>
        <tr *ngIf="empleados.length === 0">
          <td colspan="5" class="no-data">No hay empleados registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
